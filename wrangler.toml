# MIRROR RUSH — 게임과 순위 API를 한 주소에서 함께 배포합니다.
#   같은 출처가 되므로 CORS 설정이 필요 없고, 배포도 한 번이면 끝납니다.
#
#   저장소 최상위에서:  wrangler deploy

name = "mirror-rush"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# public/ 안의 정적 파일(게임)을 그대로 서빙합니다.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mirror-rush"
database_id = "a0f164d6-0aa0-4364-b9e8-c59ba3d43be7"
