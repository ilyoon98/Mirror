<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MIRROR RUSH — 거울 방 레이저</title>
<style>
  :root{
    --bg:#070710;
    --panel:#0e0f1d;
    --line:#1f2340;
    --cyan:#3df0ff;
    --pink:#ff3d8b;
    --gold:#ffd23d;
    --green:#3dff9e;
    --dim:#6b7299;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1000px 600px at 50% -10%, #16183a 0%, transparent 60%),
      var(--bg);
    color:#e8ecff;
    font-family:"Segoe UI", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; padding:14px 12px 24px; gap:12px;
    overflow-x:hidden;
  }

  /* ---------- HUD ---------- */
  .wrap{width:100%;max-width:470px;display:flex;flex-direction:column;gap:10px}
  .title{
    display:flex;align-items:baseline;justify-content:space-between;
    letter-spacing:.18em;font-size:13px;color:var(--dim);
  }
  .title b{color:var(--cyan);font-size:15px;letter-spacing:.24em;text-shadow:0 0 14px rgba(61,240,255,.55)}
  .hud{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  }
  .stat{
    background:linear-gradient(180deg,#12142a,#0c0d1c);
    border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:center;
  }
  .stat .k{font-size:9px;letter-spacing:.16em;color:var(--dim)}
  .stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .v.score{color:var(--gold)}
  .v.combo{color:var(--pink)}
  .v.life{color:var(--green);letter-spacing:1px}

  .timebar{height:7px;background:#14162c;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--green));
    transform-origin:left;border-radius:99px;transition:background .2s}
  .timebar.warn i{background:linear-gradient(90deg,var(--gold),var(--pink))}

  .goal{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--dim);padding:0 2px;
  }
  .goal b{color:#dfe4ff;font-weight:600}
  .goal .best{color:var(--gold)}

  /* ---------- BOARD ---------- */
  .board{position:relative;width:100%;aspect-ratio:1/1}
  svg{width:100%;height:100%;display:block;overflow:visible;touch-action:manipulation}

  .cellbg{fill:#11132a;stroke:#232748;stroke-width:1.5;rx:8}
  .cellbg.mirror{fill:#0d0f22}

  .quad{fill:transparent;cursor:pointer;transition:fill .09s}
  .qwrap:hover .quad{fill:rgba(61,240,255,.16)}
  .qwrap .arr{opacity:0;fill:var(--cyan);pointer-events:none;transition:opacity .09s}
  .qwrap:hover .arr{opacity:1}
  .locked .qwrap .quad{cursor:default;fill:transparent!important}
  .locked .qwrap .arr{opacity:0!important}

  .mline{stroke:#cfd8ff;stroke-width:6;stroke-linecap:round;filter:url(#soft)}
  .mline2{stroke:#5f6ba8;stroke-width:12;stroke-linecap:round;opacity:.35}

  .exitglow{fill:none;stroke:var(--green);stroke-width:3.5;stroke-linecap:round;filter:url(#glow)}
  .exitarrow{fill:var(--green);filter:url(#glow)}

  .beam{fill:none;stroke:var(--cyan);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
  .beamglow{fill:none;stroke:var(--cyan);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;
    opacity:.42;filter:url(#glow)}
  .beam.bad,.beamglow.bad{stroke:var(--pink)}

  .emitter{fill:var(--cyan);filter:url(#glow)}

  /* ---------- OVERLAYS ---------- */
  .flash{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;flex-direction:column;gap:4px;
  }
  .flash .big{
    font-size:44px;font-weight:800;letter-spacing:.1em;
    opacity:0;transform:scale(.7);
  }
  .flash .sub{font-size:15px;font-weight:600;opacity:0;color:#cfd6ff}
  .flash.show .big{animation:pop .55s cubic-bezier(.2,1.5,.4,1) forwards}
  .flash.show .sub{animation:fade .55s ease forwards .1s}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  @keyframes fade{to{opacity:1}}

  .screen{
    position:absolute;inset:-10px;background:rgba(6,7,16,.93);backdrop-filter:blur(3px);
    border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;z-index:5;
  }
  .screen.hide{display:none}
  .screen h1{margin:0;font-size:30px;letter-spacing:.16em;color:var(--cyan);
    text-shadow:0 0 22px rgba(61,240,255,.5)}
  .screen p{margin:0;font-size:13px;line-height:1.9;color:#aab2d8;max-width:330px}
  .screen p em{color:var(--gold);font-style:normal;font-weight:700}
  .btn{
    margin-top:6px;padding:12px 30px;border-radius:99px;border:1px solid var(--cyan);
    background:rgba(61,240,255,.1);color:var(--cyan);font-size:14px;font-weight:700;
    letter-spacing:.14em;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:rgba(61,240,255,.24);box-shadow:0 0 22px rgba(61,240,255,.35)}
  .finalscore{font-size:46px;font-weight:800;color:var(--gold);letter-spacing:.02em}
  .hintrow{font-size:11px;color:var(--dim);letter-spacing:.06em}

  .shake{animation:shake .34s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
    40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}
  }
  .footer{font-size:11px;color:#454b70;letter-spacing:.08em;text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <div class="title"><b>MIRROR RUSH</b><span>거울 방 레이저</span></div>

  <div class="hud">
    <div class="stat"><div class="k">LEVEL</div><div class="v" id="uiLevel">1</div></div>
    <div class="stat"><div class="k">SCORE</div><div class="v score" id="uiScore">0</div></div>
    <div class="stat"><div class="k">COMBO</div><div class="v combo" id="uiCombo">x1.0</div></div>
    <div class="stat"><div class="k">LIFE</div><div class="v life" id="uiLife">●●●</div></div>
  </div>

  <div class="timebar" id="timebar"><i id="timefill"></i></div>

  <div class="goal">
    <span>칸을 클릭 → <b>클릭한 방향</b>으로 발사</span>
    <span class="best">최대 <b id="uiBest">-</b>칸</span>
  </div>

  <div class="board" id="board">
    <svg id="svg" viewBox="0 0 452 452">
      <defs>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="gCells"></g>
      <g id="gExit"></g>
      <g id="gBeam"></g>
      <g id="gQuads"></g>
    </svg>

    <div class="flash" id="flash"><div class="big" id="flashBig"></div><div class="sub" id="flashSub"></div></div>

    <div class="screen" id="screenStart">
      <h1>MIRROR RUSH</h1>
      <p>
        5×5 방에 <em>거울</em>이 대각선으로 놓여 있습니다.<br>
        칸의 <em>위·아래·왼쪽·오른쪽 영역</em>을 클릭하면<br>
        그 방향으로 레이저가 발사됩니다.<br>
        <em>초록 출구</em>로 빠져나가면 클리어!<br>
        레이저가 <em>많은 칸을 지날수록</em> 고득점.
      </p>
      <button class="btn" id="btnStart">START</button>
      <div class="hintrow">제한시간 안에 못 쏘거나 빗나가면 라이프 −1</div>
    </div>

    <div class="screen hide" id="screenOver">
      <h1 style="color:var(--pink);text-shadow:0 0 22px rgba(255,61,139,.5)">GAME OVER</h1>
      <div class="finalscore" id="finalScore">0</div>
      <p><b id="finalDetail" style="color:#aab2d8;font-weight:400"></b></p>
      <button class="btn" id="btnRetry">RETRY</button>
      <div class="hintrow">SPACE 키로도 재시작</div>
    </div>
  </div>

  <div class="footer">거울 <span style="color:#cfd8ff">╱ ╲</span> 에서 90° 반사 · 같은 자리를 맴돌면 실패</div>
</div>

<script>
/* ============================ 상수 ============================ */
const N = 5, CELL = 72, GAP = 8, PAD = 30;
const STEP = CELL + GAP;                 // 셀 중심 간 거리
const DIRS = { N:[-1,0], E:[0,1], S:[1,0], W:[0,-1] };
const DKEYS = ['N','E','S','W'];
const REFLECT = {
  '/' : { N:'E', E:'N', S:'W', W:'S' },
  '\\': { N:'W', W:'N', S:'E', E:'S' }
};
const cx = c => PAD + c * STEP + CELL/2;
const cy = r => PAD + r * STEP + CELL/2;
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];

/* ============================ 상태 ============================ */
const S = {
  level:1, score:0, life:3, combo:0,
  grid:null, exit:null, best:0,
  phase:'idle',            // idle | ready | firing | over
  timeLimit:0, tEnd:0, raf:0
};

const $ = id => document.getElementById(id);
const gCells=$('gCells'), gExit=$('gExit'), gBeam=$('gBeam'), gQuads=$('gQuads');
const SVGNS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

/* ============================ 사운드 ============================ */
let AC=null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function blip(freq, dur=0.06, type='square', vol=0.05, at=0){
  try{
    const c=ac(), t=c.currentTime+at;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const sClear = () => [660,880,1320].forEach((f,i)=>blip(f,0.16,'triangle',0.06,i*0.07));
const sFail  = () => { blip(160,0.22,'sawtooth',0.05); blip(110,0.3,'sawtooth',0.045,0.08); };

/* ============================ 시뮬레이션 ============================ */
// (r,c)에서 d 방향으로 발사 → 지나간 칸 목록 / 탈출한 경계면
function simulate(grid, r, c, d){
  const path=[[r,c]], seen=new Set();
  for(let i=0;i<300;i++){
    const key = r+','+c+','+d;
    if(seen.has(key)) return { path, exit:null, loop:true };
    seen.add(key);
    const [dr,dc]=DIRS[d], nr=r+dr, nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N) return { path, exit:r+','+c+','+d, loop:false };
    r=nr; c=nc; path.push([r,c]);
    const m=grid[r][c];
    if(m) d = REFLECT[m][d];
  }
  return { path, exit:null, loop:true };
}

/* ============================ 맵 생성 ============================ */
function genLevel(level){
  const mirrorCount = Math.min(4 + Math.floor(level*0.7), 13);
  const wantLen     = Math.min(5 + Math.floor(level/2), 14);

  for(let attempt=0; attempt<800; attempt++){
    const grid = Array.from({length:N}, ()=>Array(N).fill(null));
    const cells=[]; for(let r=0;r<N;r++) for(let c=0;c<N;c++) cells.push([r,c]);
    for(let i=cells.length-1;i>0;i--){ const j=rnd(i+1); [cells[i],cells[j]]=[cells[j],cells[i]]; }
    for(let i=0;i<mirrorCount;i++){ const [r,c]=cells[i]; grid[r][c] = Math.random()<0.5 ? '/' : '\\'; }

    // 모든 출발점(빈 칸 × 4방향)을 돌려 경계면별 통계 수집
    const byExit = new Map();
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(grid[r][c]) continue;
      for(const d of DKEYS){
        const res = simulate(grid,r,c,d);
        if(!res.exit) continue;
        const e = byExit.get(res.exit) || { count:0, best:0 };
        e.count++;
        if(res.path.length > e.best) e.best = res.path.length;
        byExit.set(res.exit, e);
      }
    }

    const relax = attempt > 400;
    const minLen = relax ? Math.max(4, wantLen-3) : wantLen;
    const maxSol = relax ? 10 : 6;

    const cands=[];
    for(const [exitKey,e] of byExit)
      if(e.count>=1 && e.count<=maxSol && e.best>=minLen) cands.push([exitKey,e]);

    if(cands.length){
      const [exitKey,e] = pick(cands);
      return { grid, exit:exitKey, best:e.best };
    }
  }
  // 안전망 (사실상 도달하지 않음)
  const grid = Array.from({length:N},()=>Array(N).fill(null));
  return { grid, exit:'2,4,E', best:5 };
}

/* ============================ 렌더링 ============================ */
function arrowPts(x,y,d){
  const [dr,dc]=DIRS[d], L=25, W=9, B=12;
  const tx=x+dc*L, ty=y+dr*L;
  const bx=x+dc*B, by=y+dr*B;
  const px=-dr, py=dc;                          // 수직 벡터
  return `${tx},${ty} ${bx+px*W},${by+py*W} ${bx-px*W},${by-py*W}`;
}

function drawBoard(){
  gCells.innerHTML=''; gExit.innerHTML=''; gBeam.innerHTML=''; gQuads.innerHTML='';

  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const x=PAD+c*STEP, y=PAD+r*STEP, m=S.grid[r][c];
    gCells.appendChild(mk('rect',{x,y,width:CELL,height:CELL,rx:8,
      class:'cellbg'+(m?' mirror':'')}));

    if(m){
      const p = 13;
      const a = m==='/' ? [x+p, y+CELL-p, x+CELL-p, y+p] : [x+p, y+p, x+CELL-p, y+CELL-p];
      gCells.appendChild(mk('line',{x1:a[0],y1:a[1],x2:a[2],y2:a[3],class:'mline2'}));
      gCells.appendChild(mk('line',{x1:a[0],y1:a[1],x2:a[2],y2:a[3],class:'mline'}));
    } else {
      const mx=x+CELL/2, my=y+CELL/2;
      const tri = {
        N:`${x},${y} ${x+CELL},${y} ${mx},${my}`,
        E:`${x+CELL},${y} ${x+CELL},${y+CELL} ${mx},${my}`,
        S:`${x+CELL},${y+CELL} ${x},${y+CELL} ${mx},${my}`,
        W:`${x},${y+CELL} ${x},${y} ${mx},${my}`
      };
      for(const d of DKEYS){
        const g = mk('g',{class:'qwrap'});
        g.appendChild(mk('polygon',{points:tri[d],class:'quad'}));
        g.appendChild(mk('polygon',{points:arrowPts(mx,my,d),class:'arr'}));
        g.addEventListener('click',()=>fire(r,c,d));
        gQuads.appendChild(g);
      }
    }
  }
  drawExit();
}

function drawExit(){
  const [r,c,d] = S.exit.split(',');
  const [dr,dc] = DIRS[d];
  const x = cx(+c) + dc*(CELL/2+5), y = cy(+r) + dr*(CELL/2+5);
  const px=-dr, py=dc, W=20;
  gExit.appendChild(mk('line',{
    x1:x+px*W, y1:y+py*W, x2:x-px*W, y2:y-py*W, class:'exitglow' }));
  const tipX = x + dc*20, tipY = y + dr*20;
  gExit.appendChild(mk('polygon',{
    points:`${tipX},${tipY} ${x+dc*7+px*10},${y+dr*7+py*10} ${x+dc*7-px*10},${y+dr*7-py*10}`,
    class:'exitarrow'}));
}

/* ============================ 발사 ============================ */
function fire(r,c,d){
  if(S.phase!=='ready') return;
  S.phase='firing';
  stopTimer();
  const remain = Math.max(0,(S.tEnd-performance.now())/1000);
  const res = simulate(S.grid,r,c,d);
  const ok  = res.exit === S.exit;

  document.querySelector('.board').classList.add('locked');
  gQuads.innerHTML='';

  // 경로 좌표
  const pts = res.path.map(([pr,pc])=>[cx(pc),cy(pr)]);
  if(res.exit){
    const [er,ec,ed]=res.exit.split(',');
    const [ddr,ddc]=DIRS[ed];
    pts.push([cx(+ec)+ddc*(CELL/2+PAD*0.7), cy(+er)+ddr*(CELL/2+PAD*0.7)]);
  }
  const dstr = pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');

  gBeam.appendChild(mk('circle',{cx:cx(c),cy:cy(r),r:9,class:'emitter'}));
  const glow = mk('path',{d:dstr,class:'beamglow'+(ok?'':' bad')});
  const line = mk('path',{d:dstr,class:'beam'+(ok?'':' bad')});
  gBeam.appendChild(glow); gBeam.appendChild(line);

  const len = line.getTotalLength();
  const dur = Math.min(1250, Math.max(340, 68*(pts.length-1)));
  [glow,line].forEach(el=>{
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    el.style.transition = `stroke-dashoffset ${dur}ms linear`;
  });
  requestAnimationFrame(()=>{ glow.style.strokeDashoffset=0; line.style.strokeDashoffset=0; });

  const cells = res.path.length;
  for(let i=0;i<Math.min(cells,26);i++)
    blip(520 + i*32, 0.04, 'square', 0.028, (i*dur/(pts.length-1))/1000);

  setTimeout(()=>resolve(ok,res,cells,remain), dur+120);
}

function resolve(ok,res,cells,remain){
  if(ok){
    const perfect = cells >= S.best;
    const base    = cells*10;
    const timeB   = Math.round(remain*8);
    const mult    = 1 + S.combo*0.15;
    const gain    = Math.round((base*(perfect?2:1) + timeB) * mult);
    S.score += gain; S.combo++;
    sClear();
    showFlash(perfect?'PERFECT!':'CLEAR',
      `${cells}칸 · +${gain}`, perfect?'var(--gold)':'var(--green)');
    updateHUD();
    setTimeout(()=>{ S.level++; nextLevel(); }, 820);
  }else{
    S.life--; S.combo=0;
    sFail();
    const why = res.loop ? '무한 반사!' : '출구가 아닙니다';
    showFlash('MISS', why, 'var(--pink)');
    document.querySelector('.board').classList.add('shake');
    setTimeout(()=>document.querySelector('.board').classList.remove('shake'),360);
    updateHUD();
    setTimeout(()=>{ S.life<=0 ? gameOver() : nextLevel(); }, 900);
  }
}

function timeout(){
  if(S.phase!=='ready') return;
  S.phase='firing';
  stopTimer(); gQuads.innerHTML='';
  S.life--; S.combo=0; sFail();
  showFlash('TIME UP','시간 초과','var(--pink)');
  updateHUD();
  setTimeout(()=>{ S.life<=0 ? gameOver() : nextLevel(); }, 900);
}

/* ============================ 흐름 ============================ */
function nextLevel(){
  const lv = genLevel(S.level);
  S.grid=lv.grid; S.exit=lv.exit; S.best=lv.best;
  document.querySelector('.board').classList.remove('locked');
  drawBoard();
  updateHUD();
  S.phase='ready';
  S.timeLimit = Math.max(6, 13 - S.level*0.4);
  S.tEnd = performance.now() + S.timeLimit*1000;
  tick();
}

function tick(){
  const left = S.tEnd - performance.now();
  const f = Math.max(0, left/(S.timeLimit*1000));
  $('timefill').style.transform = `scaleX(${f})`;
  $('timebar').classList.toggle('warn', f<0.34);
  if(left<=0){ timeout(); return; }
  S.raf = requestAnimationFrame(tick);
}
function stopTimer(){ cancelAnimationFrame(S.raf); }

function updateHUD(){
  $('uiLevel').textContent = S.level;
  $('uiScore').textContent = S.score.toLocaleString();
  $('uiCombo').textContent = 'x'+(1+S.combo*0.15).toFixed(2);
  $('uiLife').textContent  = '●'.repeat(Math.max(0,S.life)) + '○'.repeat(Math.max(0,3-S.life));
  $('uiBest').textContent  = S.best || '-';
}

function showFlash(big,sub,color){
  const f=$('flash');
  $('flashBig').textContent=big; $('flashBig').style.color=color;
  $('flashSub').textContent=sub;
  f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'), 900);
}

function gameOver(){
  S.phase='over'; stopTimer();
  $('finalScore').textContent = S.score.toLocaleString();
  $('finalDetail').textContent = `LEVEL ${S.level} 도달`;
  $('screenOver').classList.remove('hide');
}

function startGame(){
  try{ ac().resume(); }catch(e){}
  S.level=1; S.score=0; S.life=3; S.combo=0;
  $('screenStart').classList.add('hide');
  $('screenOver').classList.add('hide');
  nextLevel();
}

$('btnStart').onclick = startGame;
$('btnRetry').onclick = startGame;
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); if(S.phase==='idle'||S.phase==='over') startGame(); }
});
</script>
</body>
</html>
